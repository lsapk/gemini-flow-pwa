<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f9f9fb" />
    <title>Deepflow — Hors ligne</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f9f9fb;
        color: #242636;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        max-width: 380px;
        padding: 32px;
      }
      h1 {
        font-size: 32px;
        letter-spacing: -1px;
      }
      p {
        color: #676875;
        line-height: 1.7;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 13px 20px;
        border-radius: 12px;
        background: #6266ce;
        color: white;
        text-decoration: none;
      }
      :focus-visible {
        outline: 3px solid #6266ce;
        outline-offset: 5px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>DEEPFLOW</p>
      <h1>Une pause de connexion.</h1>
      <p>
        Retrouvez votre espace dès que votre connexion revient. Les données
        privées et les modifications ne sont pas conservées par ce cache hors
        ligne.
      </p>
      <a href="/">Réessayer</a>
    </main>
  </body>
</html>
